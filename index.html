<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="2028 年高考倒计时 · 高中进度追踪 · 每日一言">
  <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
  <meta property="og:title" content="2028 高考倒计时">
  <meta property="og:description" content="向着月亮出发，即使不能到达，也能站在群星之中。">

  <title>2028 高考倒计时</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

  <!-- 柔光背景：玻璃需要有东西可以透。纯 CSS，无 JS 也能显示 -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <!-- SVG 图标精灵：内联以避免任何外部请求 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </symbol>
    <symbol id="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="13" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 4v5h-5"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8z"/>
    </symbol>
  </svg>

  <main class="stage">
    <article class="card">

      <!-- ========== 头部：标题 + 主题切换 ========== -->
      <header class="card__head">
        <div class="head__text">
          <p class="eyebrow">Countdown</p>
          <h1 class="title" id="examName">2028 高考</h1>
          <p class="subtitle">
            <b id="examDate">2028.06.07</b> · <span id="examWeekday">星期三</span>
            <span id="examClock"></span>
          </p>
        </div>
        <button class="icon-btn" id="themeToggle" type="button"
                aria-label="切换主题" title="切换主题">
          <svg aria-hidden="true"><use id="themeIcon" href="#i-auto"></use></svg>
        </button>
      </header>

      <!-- ========== 倒计时 ========== -->
      <section>
        <div class="countdown" id="countdown" role="timer" aria-live="off">
          <div class="unit" data-unit="days">
            <span class="unit__value tnum" data-value="days">--</span>
            <span class="unit__label">Days</span>
          </div>
          <div class="unit" data-unit="hours">
            <span class="unit__value tnum" data-value="hours">--</span>
            <span class="unit__label">Hours</span>
          </div>
          <div class="unit" data-unit="minutes">
            <span class="unit__value tnum" data-value="minutes">--</span>
            <span class="unit__label">Minutes</span>
          </div>
          <div class="unit" data-unit="seconds">
            <span class="unit__value tnum" data-value="seconds">--</span>
            <span class="unit__label">Seconds</span>
          </div>
        </div>
        <p class="sr-only" id="srStatus" aria-live="polite"></p>
      </section>

      <!-- ========== 抵达横幅 ========== -->
      <section>
        <div class="reached" id="reachedBanner">
          <svg aria-hidden="true"><use href="#i-star"></use></svg>
          <span>已抵达。愿你落笔生花，金榜题名。</span>
        </div>
      </section>

      <!-- ========== 进度 ========== -->
      <section class="progress" aria-labelledby="progressTitle">
        <div class="progress__head">
          <h2 id="progressTitle">高中进度</h2>
          <b class="tnum" id="progressPercent">0%</b>
        </div>

        <div class="progress__track" role="progressbar"
             aria-labelledby="progressTitle"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
             id="progressBar">
          <div class="progress__fill" id="progressFill"></div>
          <span class="progress__marker" id="progressMarker"></span>
        </div>

        <div class="progress__ends">
          <span><b id="startLabel">2025.02.28</b> 启程</span>
          <span><b id="targetLabel">2028.06.07</b> 抵达</span>
        </div>

        <ul class="stats">
          <li class="stat">
            <span class="stat__value tnum" id="statElapsed">--</span>
            <span class="stat__key">已过天数</span>
          </li>
          <li class="stat">
            <span class="stat__value tnum" id="statRemain">--</span>
            <span class="stat__key">剩余天数</span>
          </li>
          <li class="stat">
            <span class="stat__value tnum" id="statTotal">--</span>
            <span class="stat__key">全程天数</span>
          </li>
        </ul>
      </section>

      <!-- ========== 每日一言 ========== -->
      <section class="quote">
        <span class="quote__mark" aria-hidden="true">&ldquo;</span>
        <button class="quote__refresh" id="quoteRefresh" type="button"
                aria-label="换一句话" title="换一句话">
          <svg aria-hidden="true"><use href="#i-refresh"></use></svg>
        </button>
        <blockquote class="quote__text" id="quoteText">正在为你取一句话……</blockquote>
        <p class="quote__author" id="quoteAuthor"></p>
      </section>

      <!-- ========== 页脚 ========== -->
      <footer class="card__foot">
        <p class="foot__quote">每一天，都是离梦想更近的一步。</p>

        <div class="foot__actions">
          <button class="btn" id="shareBtn" type="button">
            <svg aria-hidden="true"><use href="#i-copy"></use></svg>
            <span>复制当前状态</span>
          </button>
          <span class="badge is-load" id="quoteBadge">
            <span class="badge__dot"></span>
            <span id="quoteBadgeText">每日一言 · 获取中</span>
          </span>
        </div>

        <p class="foot__note">
          免责声明：本页信息仅供参考，实际高考日期请以教育部门官方通知为准。<br>
          最后更新：<span id="lastUpdated">--</span>
        </p>
        <p class="foot__meta">设计：深度神经网络（DNN） &amp; 无际航天</p>
      </footer>

    </article>
  </main>

  <noscript>
    <p style="text-align:center;padding:24px;color:#9aadc6">
      本页的倒计时需要 JavaScript 才能运行，请在浏览器中启用后刷新。
    </p>
  </noscript>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
